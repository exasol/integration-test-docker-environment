name: CD-Extension

on:
  workflow_call:

jobs:
  standalone-executable:
    name: Create a standalone linux executable
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: SCM Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python & Poetry Environment
        uses: exasol/python-toolbox/.github/actions/python-environment@v10
        with:
          python-version: "3.10"
          poetry-version: "2.3.0"

      - name: Build standalone executable
        run: poetry run -- nox -s build-standalone-binary -- --executable-name "itde_linux_x86-64"

      - name: Execute the executable
        run: poetry run -- nox -s execute-itde -- --executable-name "dist/itde_linux_x86-64"

      - name: Upload to release
        if: ${{ inputs.release-tag != ''}}
        run: gh release upload ${TAG} dist/itde_linux_x86-64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
